# Edge cache, like the one in a front door. "cache=" in the log shows HIT or MISS.
proxy_cache_path /var/cache/nginx/edge keys_zone=edge:10m max_size=100m inactive=10m;

log_format edge '$host "$request" $status cache=$upstream_cache_status';

# Unknown hostnames get nothing.
server {
    listen 80 default_server;
    access_log /var/log/nginx/access.log edge;
    return 404;
}

# The app: its own origin, this is where the login cookie lives.
server {
    listen 80;
    access_log /var/log/nginx/access.log edge;
    server_name app.localhost;
    client_max_body_size 12m;

    add_header Content-Security-Policy "default-src 'self'; frame-src http://*.usercontent.localhost:8080; object-src 'none'; base-uri 'none'" always;
    add_header X-Content-Type-Options nosniff always;

    location /api/ {
        proxy_pass http://api:8081;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://web:80;
    }
}

# Untrusted code: one origin per artifact, derived from the hostname.
#
#   <artifact-id>--<user>.usercontent.localhost:8080/t/<token>/v2/index.html
#     -> asks the API whether the token is valid
#     -> blobstore:9000/u-<user>/<artifact-id>/v2/index.html
#
# The regex only admits UUIDs and usernames, so a host cannot break out of its folder.
server {
    listen 80;
    access_log /var/log/nginx/access.log edge;
    server_name "~^(?<artifact>[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})--(?<owner>[a-z0-9]{1,20})\.usercontent\.localhost$";

    # Read-only from outside. Only the API writes, over the internal network.
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    location = /_authorize {
        internal;
        proxy_pass http://api:8081/internal/authorize-content;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Artifact $artifact;
        proxy_set_header X-Owner $owner;
        proxy_set_header X-Version $version;
        proxy_set_header X-Content-Token $token;
        proxy_set_header X-Fetch-Dest $http_sec_fetch_dest;
    }

    location ~ ^/t/(?<token>[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+)/(?<version>v[0-9]+)/(?<blob>.+)$ {
        # Runs before the cache, so a cached file is never served without a valid token.
        auth_request /_authorize;

        rewrite ^ /u-$owner/$artifact/$version/$blob break;
        proxy_pass http://blobstore:9000;

        # A version never changes, so the edge may cache it. The token stays out of the key,
        # otherwise every new link would miss the cache.
        proxy_cache edge;
        proxy_cache_key $host/$version/$blob;
        proxy_cache_valid 200 60s;
        add_header X-Cache-Status $upstream_cache_status always;

        # Browsers must not cache, or a deleted artifact could survive there indefinitely.
        add_header Cache-Control "no-cache" always;

        # "sandbox" also applies when someone opens the URL directly and skips the app's iframe.
        # connect-src 'none' stops the code from sending data anywhere.
        add_header Content-Security-Policy "sandbox allow-scripts; default-src 'none'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'none'; form-action 'none'; base-uri 'none'; frame-ancestors http://app.localhost:8080" always;
        add_header X-Content-Type-Options nosniff always;

        # Sandboxed documents have origin "null", so <script type="module"> and fonts fail without CORS.
        # Harmless here because reading still needs a valid token in the path.
        add_header Access-Control-Allow-Origin "*" always;
    }

    location / {
        return 404;
    }
}
