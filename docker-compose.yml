services:
  # Stands in for Azure Front Door: the only way in, routes by hostname, caches, sets the security headers.
  frontdoor:
    image: nginx:1.29-alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./frontdoor/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api: { condition: service_started, restart: true }
      web: { condition: service_started, restart: true }
      blobstore: { condition: service_started, restart: true }

  # TypeScript frontend as static files.
  web:
    build: ./web

  # Control plane: users, metadata, versions, retention job.
  api:
    build: ./api
    environment:
      DATABASE_URL: postgres://artifacts:artifacts@postgres:5432/artifacts
      BLOB_URL: http://blobstore:9000
      CONTENT_HOST: usercontent.localhost:8080
      # Local development value, signs the links the app hands out after login.
      CONTENT_TOKEN_KEY: local-development-only
      # The agent loop: the model gateway it calls and the sandboxes its tool calls run in.
      LLM_URL: http://llmgateway:4000
      LLM_API_KEY: local-development-only
      LLM_MODEL: agent
      # Empty means the model decides. "none" turns thinking off: about 3 instead of 11 seconds per step.
      AGENT_REASONING_EFFORT: ""
      SANDBOXD_URL: http://sandboxd:8090
      SANDBOXD_TOKEN: local-development-only
    depends_on:
      postgres: { condition: service_healthy }
      blobstore: { condition: service_started }
      sandboxd: { condition: service_started }
      llmgateway: { condition: service_started }

  # Stands in for a storage account: keeps blobs as files, reachable from outside only through the front door.
  blobstore:
    build: ./blobstore
    volumes:
      - blobdata:/data

  # Stands in for Azure Container Apps Sandboxes: one Firecracker microVM per sandbox.
  # Needs /dev/kvm on the host. Reachable only from inside the compose network.
  sandboxd:
    build: ./sandboxd
    devices:
      - /dev/kvm
    environment:
      # Local development value. On Azure this would be Entra ID with a data plane role.
      SANDBOXD_TOKEN: local-development-only
      MAX_SANDBOXES: 4
      # A demo secret for egress rules with action Transform: {secret:DEMO} in a header value.
      # The VM never sees it, the egress proxy adds it on the way out.
      SANDBOX_SECRET_DEMO: local-demo-secret
    volumes:
      - sandboxdata:/data
    security_opt:
      - no-new-privileges:true

  # Stands in for Azure AI Foundry: the model gateway the api calls. The api only knows this
  # endpoint, a key, and the model name "agent".
  llmgateway:
    image: ghcr.io/berriai/litellm:v1.102.1
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      # Local development value, the api sends it as its API key.
      LITELLM_MASTER_KEY: local-development-only
    volumes:
      - ./llmgateway/config.yaml:/app/config.yaml:ro
    depends_on:
      models: { condition: service_completed_successfully }

  # Runs the model on the GPU. Vulkan works on AMD and Intel without ROCm and only needs /dev/dri.
  ollama:
    image: ollama/ollama:0.35.1
    devices:
      - /dev/dri
    environment:
      # Local models only, no Ollama cloud models.
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_KEEP_ALIVE: 10m
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30

  # One-shot: creates the model "agent-llm" with a 32k context. It uses a GGUF file from models/
  # if there is one, otherwise it downloads qwen3.5:9b-q8_0 from the Ollama registry (10.5 GB).
  models:
    image: ollama/ollama:0.35.1
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: ["/bin/sh", "/create-model.sh"]
    volumes:
      - ./ollama/create-model.sh:/create-model.sh:ro
      - ./models:/models:ro
    depends_on:
      ollama: { condition: service_healthy }
    restart: "no"

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: artifacts
      POSTGRES_PASSWORD: artifacts
      POSTGRES_DB: artifacts
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # -h forces TCP: the temporary init server only listens on the Unix socket and would report "ready" too early.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "artifacts"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  ollama-models:
  sandboxdata:
  blobdata:
  pgdata:
